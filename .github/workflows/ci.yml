name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Tests - decomposition identities, reconciliation, quoted figures
        run: Rscript tests/testthat.R

      - name: Rebuild every output from the snapshots
        run: Rscript scripts/build.R

      - name: Tables and dashboard are unchanged
        # Figures are left out: SVG text metrics depend on the fonts of the machine.
        run: |
          git diff --exit-code --stat -- outputs dashboard \
            || (echo "::error::Rebuilding changed a committed output" && exit 1)

      - name: Render the article and the working paper
        run: quarto render

      - name: Assemble the site
        run: |
          mkdir -p site/dashboard
          cp _site/article/index.html site/index.html
          cp _site/paper/paper.pdf site/paper.pdf
          cp dashboard/index.html site/dashboard/index.html
          cp -r figures site/figures

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
